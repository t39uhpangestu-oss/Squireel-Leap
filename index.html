<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Squirrel Leap 2: Endless Jump</title>
<meta name="description" content="Endless squirrel jumping through obstacles. Unlimited runs, unlimited score.">
<meta name="theme-color" content="#1b2a3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
.ov.show{display:flex}
.box{background:rgba(18,20,34,.92);color:#fff;padding:18px 20px;border-radius:14px;text-align:center;max-width:92vw;max-height:94vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.5)}
h1{margin:4px 0;font-size:clamp(22px,4vw,34px);color:#ffb020}
h2{margin:4px 0;color:#ffb020}
h3{margin:10px 0 6px;font-size:16px}
p{margin:6px 0}
.small{font-size:13px;opacity:.8}
button{font-family:inherit;cursor:pointer}
.big{font-size:18px;font-weight:bold;padding:10px 24px;border:0;border-radius:10px;background:#ffb020;color:#222;margin:6px}
.big.alt{background:#5b6b8c;color:#fff}
#chars{display:grid;grid-template-columns:repeat(5,minmax(60px,1fr));gap:8px;margin:8px 0}
.char{background:#23263d;color:#fff;border:2px solid transparent;border-radius:10px;padding:8px 4px;font-size:13px}
.char.sel{border-color:#ffb020;background:#33375a}
.dot{display:block;width:34px;height:34px;margin:0 auto 6px;border-radius:50%;border:3px solid}
a{color:#ffd27a}
#mute{position:fixed;top:8px;right:8px;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px}
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>

<div id="intro" class="ov show"><div class="box">
  <h1>Squirrel Leap 2</h1>
  <p>Endless Jump</p>
  <button class="big" id="startBtn">TAP TO START</button>
  <p class="small">Sound is on. Tap the screen or press Space to jump.</p>
</div></div>

<div id="menu" class="ov"><div class="box">
  <h1>Squirrel Leap 2</h1>
  <h3>Choose your squirrel</h3>
  <div id="chars"></div>
  <p id="charDesc" class="small"></p>
  <p class="small">The background changes as your score grows: Halloween Night, Thunderstorm, Frozen Ice, Snow Forest, Ocean Waves.</p>
  <button class="big" id="playBtn">PLAY</button>
  <p class="small">Best score: <b id="bestMenu">0</b></p>
  <p class="small"><a href="privacy.html">Privacy</a></p>
</div></div>

<div id="over" class="ov"><div class="box">
  <h2>Game Over</h2>
  <p>Score: <b id="fs">0</b></p>
  <p>Best: <b id="fb">0</b></p>
  <button class="big" id="againBtn">PLAY AGAIN</button>
  <button class="big alt" id="toMenuBtn">MENU</button>
</div></div>

<button id="mute">Sound: On</button>

<script>
const W = 800, H = 450, GROUND = 370;

const SQUIRRELS = [
  { name: 'Chestnut', color: '#b5651d', tail: '#8b4513', jump: -15, maxJumps: 1, speed: 1,    glide: false, desc: 'Balanced jump' },
  { name: 'Ember',    color: '#e8643c', tail: '#c23b22', jump: -13, maxJumps: 2, speed: 1,    glide: false, desc: 'Double jump' },
  { name: 'Frost',    color: '#cfe8ff', tail: '#8fb8e0', jump: -14, maxJumps: 1, speed: 1,    glide: true,  desc: 'Floats down slowly' },
  { name: 'Shadow',   color: '#3a3a4a', tail: '#1e1e28', jump: -16, maxJumps: 1, speed: 1.12, glide: false, desc: 'Fast runner, high jump' },
  { name: 'Golden',   color: '#f2c14e', tail: '#d39b1e', jump: -12, maxJumps: 3, speed: 0.92, glide: false, desc: 'Triple jump, slower pace' }
];

const THEMES = [
  { name: 'Halloween Night', sky: ['#1a0b2e', '#4b1d52'], ground: '#2b1a10', accent: '#ff8c1a',
    sound: { type: 'lowpass', f: 380, v: 0.05 }, deco: ['pumpkin', 'grave', 'dead'], weather: 'bat' },
  { name: 'Thunderstorm', sky: ['#1c2331', '#3a4a5e'], ground: '#1f2a24', accent: '#9ad1ff',
    sound: { type: 'lowpass', f: 900, v: 0.07 }, deco: ['pine'], weather: 'rain' },
  { name: 'Frozen Ice', sky: ['#7fb6d9', '#d8f1ff'], ground: '#bfe3f5', accent: '#ffffff',
    sound: { type: 'highpass', f: 1800, v: 0.03 }, deco: ['spike', 'ice'], weather: 'spark' },
  { name: 'Snow Forest', sky: ['#5a7f9a', '#b8d4e3'], ground: '#eef6fb', accent: '#2e5e3e',
    sound: { type: 'lowpass', f: 600, v: 0.06 }, deco: ['pine', 'pinebig'], weather: 'snow' },
  { name: 'Ocean Waves', sky: ['#2aa3d9', '#9be4ff'], ground: '#e8d39a', accent: '#1b6fa8',
    sound: { type: 'bandpass', f: 500, v: 0.06, wave: true }, deco: ['palm'], weather: 'none' }
];

const MELODY = [
  [220, 262, 247, 196], [196, 233, 262, 233], [392, 523, 440, 349],
  [330, 392, 494, 392], [262, 330, 392, 330]
];

const KINDS = [
  { k: 'fruit', w: 70, h: 30 }, { k: 'moto', w: 100, h: 40 }, { k: 'brick', w: 100, h: 36 },
  { k: 'desk', w: 100, h: 44 }, { k: 'elec', w: 90, h: 38 }
];

// ---------- Canvas and scaling ----------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit);
fit();

// ---------- Audio (generated in code, no external files) ----------
let AC = null, master = null, amb = null, muted = false, flash = 0, frameN = 0;

function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain();
  master.gain.value = muted ? 0 : 0.5;
  master.connect(AC.destination);
  let n = 0;
  setInterval(() => {
    if (muted || state === 'intro') return;
    const m = MELODY[themeIdx];
    tone(m[n++ % m.length], 0.45, 'triangle', 0.05);
  }, 400);
  setInterval(() => {
    if (muted || THEMES[themeIdx].weather !== 'rain' || Math.random() > 0.35) return;
    noiseBurst(1.6, 0.5, 350);
    flash = 0.7;
  }, 3000);
  setAmbient(THEMES[themeIdx]);
}

function tone(f, d, type = 'square', v = 0.15, slide = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + d);
}

function noiseBurst(d, v, freq) {
  if (!AC || muted) return;
  const len = Math.floor(AC.sampleRate * d);
  const buf = AC.createBuffer(1, len, AC.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = buf;
  f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(v, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
  src.connect(f); f.connect(g); g.connect(master);
  src.start();
}

function setAmbient(T) {
  if (!AC) return;
  if (amb) {
    const old = amb;
    old.g.gain.setTargetAtTime(0, AC.currentTime, 0.3);
    setTimeout(() => { try { old.src.stop(); } catch (e) {} }, 1500);
    amb = null;
  }
  const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource();
  src.buffer = buf; src.loop = true;
  const f = AC.createBiquadFilter();
  f.type = T.sound.type; f.frequency.value = T.sound.f; f.Q.value = 0.7;
  const g = AC.createGain();
  g.gain.value = 0;
  g.gain.setTargetAtTime(T.sound.v, AC.currentTime, 0.6);
  src.connect(f); f.connect(g); g.connect(master);
  src.start();
  if (T.sound.wave) {
    const l = AC.createOscillator(), lg = AC.createGain();
    l.frequency.value = 0.2;
    lg.gain.value = T.sound.v * 0.8;
    l.connect(lg); lg.connect(g.gain);
    l.start();
  }
  amb = { g, src };
}

// ---------- Game state ----------
let state = 'intro', charIdx = 0, themeIdx = 0, banner = '', bannerT = 0;
let P, obs = [], parts = [], deco = [], dist = 0, score = 0, speed = 6, spawnCD = 0, shake = 0;
let best = 0;
try { best = Number(localStorage.getItem('sl2_best') || 0); } catch (e) {}

function newP() { return { x: 140, y: GROUND - 34, vy: 0, w: 34, h: 34, jumps: 0, onGround: true, run: 0 }; }

function applyTheme(i) {
  themeIdx = i;
  parts = [];
  deco = [];
  banner = 'NOW: ' + THEMES[i].name.toUpperCase();
  bannerT = 150;
  setAmbient(THEMES[i]);
}

function startGame() {
  initAudio();
  P = newP();
  obs = []; dist = 0; score = 0; speed = 6; spawnCD = 160; shake = 0; flash = 0;
  applyTheme(0);
  state = 'play';
  show('menu', false);
  show('over', false);
}

function die() {
  state = 'over';
  shake = 16;
  tone(110, 0.5, 'sawtooth', 0.2, -70);
  noiseBurst(0.4, 0.3, 900);
  if (score > best) {
    best = score;
    try { localStorage.setItem('sl2_best', String(best)); } catch (e) {}
  }
  document.getElementById('fs').textContent = score.toLocaleString('en-US');
  document.getElementById('fb').textContent = best.toLocaleString('en-US');
  document.getElementById('bestMenu').textContent = best.toLocaleString('en-US');
  setTimeout(() => show('over', true), 500);
}

function show(id, on) { document.getElementById(id).classList.toggle('show', on); }

function doJump() {
  if (state !== 'play') return;
  const c = SQUIRRELS[charIdx];
  if (P.jumps < c.maxJumps) {
    P.vy = c.jump * (P.jumps ? 0.9 : 1);
    P.jumps++;
    P.onGround = false;
    tone(420 + P.jumps * 90, 0.12, 'square', 0.12, 160);
  }
}

// ---------- Obstacles ----------
function spawn() {
  if (Math.random() < 0.2) {
    obs.push({ k: 'tree', x: W + 30, w: 30, h: 160, y: -170, vy: 0, t: 0 });
    return;
  }
  const d = KINDS[Math.floor(Math.random() * KINDS.length)];
  obs.push({ k: d.k, x: W + 30, w: d.w, h: d.h, y: GROUND - d.h });
}

function hit(o) {
  const a = { x: P.x + 5, y: P.y + 4, w: P.w - 10, h: P.h - 6 };
  const b = { x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 4 };
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- Background and decoration ----------
function spawnDeco(sp) {
  for (const d of deco) d.x -= sp * 0.6;
  deco = deco.filter(d => d.x > -80);
  const last = deco[deco.length - 1];
  if (!last || last.x < W - 180 + Math.random() * 120) {
    const k = THEMES[themeIdx].deco;
    deco.push({ x: W + 40, k: k[Math.floor(Math.random() * k.length)] });
  }
}

function tri(x, yb, w, h, c) {
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(x, yb - h); ctx.lineTo(x - w / 2, yb); ctx.lineTo(x + w / 2, yb);
  ctx.closePath(); ctx.fill();
}

function drawDeco(d) {
  const x = d.x, g = GROUND;
  switch (d.k) {
    case 'pumpkin':
      ctx.fillStyle = '#ff7a18'; ctx.beginPath(); ctx.arc(x, g - 14, 14, 0, 7); ctx.fill();
      ctx.fillStyle = '#3a7d24'; ctx.fillRect(x - 2, g - 30, 4, 6); break;
    case 'grave':
      ctx.fillStyle = '#6d6d7a'; ctx.fillRect(x - 12, g - 36, 24, 36);
      ctx.beginPath(); ctx.arc(x, g - 36, 12, Math.PI, 0); ctx.fill(); break;
    case 'dead':
      ctx.strokeStyle = '#2a1a14'; ctx.lineWidth = 5; ctx.beginPath();
      ctx.moveTo(x, g); ctx.lineTo(x, g - 90);
      ctx.moveTo(x, g - 60); ctx.lineTo(x + 22, g - 85);
      ctx.moveTo(x, g - 45); ctx.lineTo(x - 20, g - 70);
      ctx.stroke(); break;
    case 'pine': tri(x, g, 44, 96, '#2e5e3e'); break;
    case 'pinebig': tri(x, g, 60, 130, '#2e5e3e'); tri(x, g - 40, 46, 90, '#3a7048'); break;
    case 'spike': tri(x, g, 26, 60, '#e8f8ff'); break;
    case 'ice': ctx.fillStyle = '#bfe9ff'; ctx.fillRect(x - 14, g - 40, 28, 40); break;
    case 'palm':
      ctx.strokeStyle = '#7a5a3a'; ctx.lineWidth = 6; ctx.beginPath();
      ctx.moveTo(x, g); ctx.lineTo(x + 6, g - 80); ctx.stroke();
      ctx.strokeStyle = '#2d8a4a'; ctx.lineWidth = 5; ctx.beginPath();
      for (const a of [-2.8, -2.1, -1.2, -0.4]) {
        ctx.moveTo(x + 6, g - 80);
        ctx.lineTo(x + 6 + Math.cos(a) * 40, g - 80 + Math.sin(a) * 40 + 12);
      }
      ctx.stroke(); break;
  }
}

function drawBG() {
  const T = THEMES[themeIdx];
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (themeIdx === 0) { ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(680, 80, 36, 0, 7); ctx.fill(); }
  if (themeIdx === 4) {
    ctx.fillStyle = T.accent; ctx.globalAlpha = 0.55; ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, GROUND - 40 + Math.sin(x * 0.02 + frameN * 0.05) * 12);
    ctx.lineTo(W, GROUND); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = T.ground; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = T.accent; ctx.fillRect(0, GROUND, W, 4);
  for (const d of deco) drawDeco(d);
  if (themeIdx === 1 && flash > 0) { ctx.fillStyle = `rgba(230,240,255,${flash})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- Weather particles ----------
function spawnParts() {
  const w = THEMES[themeIdx].weather;
  if (w === 'rain' && Math.random() < 0.9)
    parts.push({ t: 'rain', x: Math.random() * (W + 100), y: -10, vx: -3, vy: 13 + Math.random() * 5 });
  else if (w === 'snow' && Math.random() < 0.3)
    parts.push({ t: 'snow', x: Math.random() * W, y: -10, vx: -0.8, vy: 1 + Math.random() * 1.5, r: 1.5 + Math.random() * 2.5 });
  else if (w === 'spark' && Math.random() < 0.15)
    parts.push({ t: 'spark', x: Math.random() * W, y: Math.random() * GROUND, vx: -0.5, vy: 0.2, life: 90 });
  else if (w === 'bat' && Math.random() < 0.012)
    parts.push({ t: 'bat', x: W + 20, y: 50 + Math.random() * 130, vx: -(2.5 + Math.random() * 2), ph: 0 });
}

function updParts() {
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy;
    if (p.t === 'spark') p.life--;
    if (p.t === 'bat') p.ph += 0.2;
  }
  parts = parts.filter(p => p.y < H + 20 && p.x > -40 && (p.life === undefined || p.life > 0));
  if (parts.length < 180) spawnParts();
}

function drawParts() {
  for (const p of parts) {
    if (p.t === 'rain') {
      ctx.strokeStyle = 'rgba(180,210,255,.6)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.vx * 1.2, p.y + 12); ctx.stroke();
    } else if (p.t === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    } else if (p.t === 'spark') {
      ctx.fillStyle = `rgba(255,255,255,${p.life / 90})`; ctx.fillRect(p.x, p.y, 2, 2);
    } else if (p.t === 'bat') {
      const f = Math.sin(p.ph) * 6;
      ctx.fillStyle = '#120818'; ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.quadraticCurveTo(p.x - 8, p.y - f, p.x - 16, p.y + 2);
      ctx.quadraticCurveTo(p.x - 8, p.y + 4, p.x, p.y + 3);
      ctx.quadraticCurveTo(p.x + 8, p.y + 4, p.x + 16, p.y + 2);
      ctx.quadraticCurveTo(p.x + 8, p.y - f, p.x, p.y);
      ctx.fill();
    }
  }
}

// ---------- Drawing obstacles and squirrel ----------
function drawObs(o) {
  const x = o.x, y = o.y;
  if (o.k === 'tree') {
    if (o.t < 60) {
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath();
      ctx.ellipse(x + o.w / 2, GROUND, o.w * 1.4, 6, 0, 0, 7); ctx.fill();
      if (Math.floor(o.t / 8) % 2) { ctx.fillStyle = '#ff3b3b'; ctx.font = 'bold 22px Arial'; ctx.fillText('!', x + o.w / 2 - 6, GROUND - 14); }
    }
    ctx.fillStyle = '#6b4423'; ctx.fillRect(x + o.w / 2 - 7, y + o.h * 0.3, 14, o.h * 0.7);
    ctx.fillStyle = '#2e6b35'; ctx.beginPath(); ctx.arc(x + o.w / 2, y + o.h * 0.25, o.w * 1.1, 0, 7); ctx.fill();
  } else if (o.k === 'fruit') {
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i % 2 ? '#8fb03a' : '#7a4f1a';
      ctx.beginPath(); ctx.arc(x + 12 + i * 15, GROUND - 10 - (i % 2) * 7, 10, 0, 7); ctx.fill();
    }
  } else if (o.k === 'moto') {
    for (let i = 0; i < 3; i++) {
      const mx = x + i * 34 + 10, my = GROUND - 14 - (i % 2) * 10;
      ctx.save(); ctx.translate(mx, my); ctx.rotate(i % 2 ? 0.35 : -0.25);
      ctx.fillStyle = i % 2 ? '#a33' : '#4a4a55'; ctx.fillRect(-18, -6, 36, 12); ctx.restore();
      ctx.fillStyle = '#111'; ctx.beginPath();
      ctx.arc(mx - 10, GROUND - 6, 6, 0, 7); ctx.arc(mx + 10, GROUND - 6, 6, 0, 7); ctx.fill();
    }
  } else if (o.k === 'brick') {
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
      const bx = x + c * 22 + (r % 2 ? 11 : 0), by = GROUND - 12 - r * 12;
      ctx.fillStyle = '#a34a2a'; ctx.fillRect(bx, by, 21, 11);
      ctx.strokeStyle = '#5c2612'; ctx.strokeRect(bx, by, 21, 11);
    }
  } else if (o.k === 'desk') {
    for (let i = 0; i < 2; i++) {
      ctx.save(); ctx.translate(x + 30 + i * 45, GROUND - 30); ctx.rotate(i ? -0.3 : 0.2);
      ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-35, -8, 70, 10);
      ctx.fillStyle = '#6a4220'; ctx.fillRect(-32, 2, 6, 28); ctx.fillRect(26, 2, 6, 28);
      ctx.restore();
    }
  } else if (o.k === 'elec') {
    for (let i = 0; i < 3; i++) {
      const bx = x + i * 30, by = GROUND - 30 - (i % 2) * 8;
      ctx.fillStyle = '#4c5060'; ctx.fillRect(bx, by, 28, 30);
      ctx.fillStyle = (Math.floor(frameN / 10 + i) % 3) ? '#7ff7ff' : '#ff6b6b';
      ctx.fillRect(bx + 4, by + 5, 20, 10);
    }
    if (Math.random() < 0.05) { ctx.fillStyle = '#ffe066'; ctx.fillRect(x + Math.random() * 90, GROUND - 38, 2, 2); }
  }
}

function drawSquirrel(c, p) {
  const x = p.x, y = p.y, w = p.w, h = p.h, air = !p.onGround;
  ctx.fillStyle = c.tail; ctx.beginPath(); ctx.ellipse(x + 4, y + h * 0.35, w * 0.28, h * 0.55, -0.5, 0, 7); ctx.fill();
  ctx.fillStyle = c.color; ctx.beginPath(); ctx.ellipse(x + w * 0.5, y + h * 0.6, w * 0.4, h * 0.36, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w * 0.78, y + h * 0.32, h * 0.24, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w * 0.7, y + h * 0.1, h * 0.08, 0, 7); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + w * 0.84, y + h * 0.29, 2.2, 0, 7); ctx.fill();
  ctx.strokeStyle = c.tail; ctx.lineWidth = 4;
  const s = air ? 0 : Math.sin(p.run) * 5;
  ctx.beginPath();
  ctx.moveTo(x + w * 0.35, y + h * 0.9); ctx.lineTo(x + w * 0.35 + s, y + h);
  ctx.moveTo(x + w * 0.6, y + h * 0.9); ctx.lineTo(x + w * 0.6 - s, y + h);
  ctx.stroke();
}

// ---------- Main loop ----------
function hitTestAll() {
  for (const o of obs) if (hit(o)) { die(); return; }
}

function step() {
  frameN++;
  flash *= 0.92;
  const bgSpeed = state === 'play' ? speed : (state === 'menu' ? 3 : 0);
  spawnDeco(bgSpeed);
  updParts();

  if (state === 'play') {
    const c = SQUIRRELS[charIdx];
    P.vy += 0.75;
    if (c.glide && P.vy > 0) P.vy = Math.min(P.vy, 2.2);
    P.y += P.vy;
    if (P.y >= GROUND - P.h) {
      if (!P.onGround && P.vy > 4) tone(150, 0.07, 'triangle', 0.1);
      P.y = GROUND - P.h; P.vy = 0; P.onGround = true; P.jumps = 0;
    } else {
      P.onGround = false;
    }
    P.run += speed * 0.06;

    speed = (6 + dist / 1200) * c.speed;
    dist += speed;
    score = Math.floor(dist / 10);

    const ti = Math.floor(score / 400) % THEMES.length;
    if (ti !== themeIdx) applyTheme(ti);

    spawnCD -= speed;
    if (spawnCD <= 0) { spawn(); spawnCD = Math.max(230, 470 - speed * 14) + Math.random() * 220; }

    for (const o of obs) {
      o.x -= speed;
      if (o.k === 'tree') {
        o.t++;
        if (o.t > 60) {
          o.vy += 1.1; o.y += o.vy;
          if (o.y >= GROUND - o.h) { o.y = GROUND - o.h; o.vy = 0; }
        }
      }
    }
    obs = obs.filter(o => o.x > -200);
    hitTestAll();
  }
  if (bannerT > 0) bannerT--;
  if (shake > 0) { shake *= 0.85; if (shake < 0.5) shake = 0; }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBG();
  drawParts();
  for (const o of obs) drawObs(o);
  drawSquirrel(SQUIRRELS[charIdx], P);

  if (state === 'play' || state === 'over') {
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 4;
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.fillText('SCORE ' + score.toLocaleString('en-US'), 16, 34);
    ctx.font = '14px Arial';
    ctx.fillText('BEST ' + best.toLocaleString('en-US'), 16, 56);
    ctx.textAlign = 'center'; ctx.font = 'bold 16px Arial';
    ctx.fillText(THEMES[themeIdx].name.toUpperCase(), W / 2, 30);
    if (bannerT > 0) {
      ctx.globalAlpha = Math.min(1, bannerT / 30);
      ctx.font = 'bold 30px Arial';
      ctx.fillText(banner, W / 2, H / 2 - 40);
      ctx.globalAlpha = 1;
    }
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function loop() { step(); render(); requestAnimationFrame(loop); }

// ---------- Menus and input ----------
const charsBox = document.getElementById('chars');
SQUIRRELS.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'char';
  b.innerHTML = `<span class="dot" style="background:${s.color};border-color:${s.tail}"></span>${s.name}`;
  b.onclick = () => selChar(i);
  charsBox.appendChild(b);
});
function selChar(i) {
  charIdx = i;
  [...charsBox.children].forEach((b, j) => b.classList.toggle('sel', j === i));
  document.getElementById('charDesc').textContent = SQUIRRELS[i].name + ': ' + SQUIRRELS[i].desc;
}

document.getElementById('startBtn').onclick = () => {
  initAudio();
  state = 'menu';
  show('intro', false);
  show('menu', true);
};
document.getElementById('playBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;
document.getElementById('toMenuBtn').onclick = () => {
  state = 'menu';
  show('over', false);
  show('menu', true);
};

const muteBtn = document.getElementById('mute');
muteBtn.onclick = () => {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.5;
  muteBtn.textContent = muted ? 'Sound: Off' : 'Sound: On';
  muteBtn.blur();
};

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); doJump(); }
  if (e.code === 'Enter' && state === 'menu') startGame();
});
addEventListener('pointerdown', e => {
  if (e.target.closest('button,a,.box')) return;
  doJump();
});

// ---------- Boot ----------
P = newP();
selChar(0);
applyTheme(0);
document.getElementById('bestMenu').textContent = best.toLocaleString('en-US');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
loop();
</script>
</body>
</html>
